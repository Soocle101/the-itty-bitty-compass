<html lang="en">
<head>

    <style>
        :root {
            --bg: #121212;

            --border: #333;
            --red: #cf6679;
            --blue: #3700b3;
            --green: #03dac6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1, h2, h3 { margin-top: 0; }
        .progress-container {
            width: 100%;
            background: var(--border);
            border-radius: 8px;
            height: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }
        .question-block { display: none; }
        .question-block.active { display: block; animation: fadeIn 0.3s ease-in; }
        .statement-btn {
            display: block;
            width: 100%;
            background: #2c2c2c;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .statement-btn:hover { background: #383838; border-color: var(--primary); }
        .statement-btn.neutral { text-align: center; color: var(--muted); }
        
        #results { display: none; }
        canvas {
            display: block;
            margin: 20px auto;
            background: #fff;
            border-radius: 4px;
            max-width: 100%;
        }
        .match-card {
            background: #2c2c2c;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
        }
        .axis-bar-wrapper { margin-top: 20px; }
        .axis-labels { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--muted); }
        .axis-bar-bg { width: 100%; height: 12px; background: var(--border); border-radius: 6px; position: relative; overflow: hidden; }
        .axis-bar-fill { height: 100%; position: absolute; top: 0; left: 50%; border-radius: 6px; transition: width 0.5s, left 0.5s; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

    let currentQ = 0;
    let userScores = { E: 0, S: 0, D: 0, C: 0 };
    const maxScorePerAxis = rawQuestions.length * 2; 

    function initQuiz() {
        const body = document.getElementById('quiz-body');
        let html = '';
        rawQuestions.forEach((qData, index) => {
            const topic = qData[0];
            const options = qData[1];
            
            html += `<div class="question-block" id="q-${index}">
                <h3>${topic}</h3>`;
            
            options.forEach((opt) => {
                html += `<button class="statement-btn" onclick="answer(${index}, ${opt[1]}, ${opt[2]}, ${opt[3]}, ${opt[4]})">${opt[0]}</button>`;
            });
            html += `<button class="statement-btn neutral" onclick="answer(${index}, 0, 0, 0, 0)">No preference / Unsure</button>
            </div>`;
        });
        body.innerHTML = html;
        showQuestion(0);
    }

    function showQuestion(index) {
        document.querySelectorAll('.question-block').forEach(el => el.classList.remove('active'));
        document.getElementById(`q-${index}`).classList.add('active');
        document.getElementById('q-counter').innerText = `Question ${index + 1} of ${rawQuestions.length}`;
        document.getElementById('progress').style.width = `${((index) / rawQuestions.length) * 100}%`;
    }

    function answer(qIndex, e, s, d, c) {
        userScores.E += e;
        userScores.S += s;
        userScores.D += d;
        userScores.C += c;
        
        if (qIndex + 1 < rawQuestions.length) {
            showQuestion(qIndex + 1);
        } else {
            document.getElementById('progress').style.width = '100%';
            showResults();
        }
    }

    const profiles = [
        { name: "Democratic Socialist", type: "US Ideology", E: -1.5, S: 0.5, D: -1.0, C: -1.5 },
        { name: "Social Democrat", type: "US Ideology", E: -1.0, S: 0.0, D: -0.5, C: -1.0 },
        { name: "Centrist", type: "US Ideology", E: 0.0, S: 0.0, D: 0.0, C: 0.0 },
        { name: "Neoliberal", type: "US Ideology", E: 0.8, S: 0.2, D: -1.2, C: -0.8 },
        { name: "Neoconservative", type: "US Ideology", E: 0.8, S: 1.0, D: 1.5, C: 1.0 },

        { name: "Liberal Democrats (UK)", type: "Int. Party", E: -0.2, S: -0.5, D: -1.5, C: -1.0 },

        { name: "SPD (Germany)", type: "Int. Party", E: -0.7, S: 0.1, D: -1.0, C: -0.6 },

    ];

    function showResults() {
        document.getElementById('quiz-header').style.display = 'none';
        document.getElementById('quiz-body').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        
        const normE = (userScores.E / maxScorePerAxis) * 4;
        const normS = (userScores.S / maxScorePerAxis) * 4;
        const normD = (userScores.D / maxScorePerAxis) * 4;
        const normC = (userScores.C / maxScorePerAxis) * 4;

        drawCompass(normE, normS);
        updateBars(normD, normC);
        calculateMatches(normE, normS, normD, normC);
    }

    function drawCompass(e, s) {
        const canvas = document.getElementById('compassCanvas');
        const ctx = canvas.getContext('2d');
        const size = canvas.width;
        const center = size / 2;
        
        ctx.fillStyle = "#ffb3b3"; ctx.fillRect(0, 0, center, center);
        ctx.fillStyle = "#b3b3ff"; ctx.fillRect(center, 0, center, center);
        ctx.fillStyle = "#b3ffb3"; ctx.fillRect(0, center, center, center);
        ctx.fillStyle = "#ffffb3"; ctx.fillRect(center, center, center, center);
        
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(center, 0); ctx.lineTo(center, size);
        ctx.moveTo(0, center); ctx.lineTo(size, center);
        ctx.stroke();

        ctx.fillStyle = "#333";
        ctx.font = "bold 14px Arial";
        ctx.fillText("AUTHORITARIAN", center - 50, 20);
        ctx.fillText("LIBERTARIAN", center - 40, size - 10);
        ctx.fillText("LEFT", 10, center - 10);
        ctx.fillText("RIGHT", size - 50, center - 10);

        const xPos = center + (e / 2) * center;
        const yPos = center - (s / 2) * center; 
        
        ctx.beginPath();
        ctx.arc(xPos, yPos, 8, 0, 2 * Math.PI);
        ctx.fillStyle = "#000";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#fff";
        ctx.stroke();
    }

    function updateBars(d, c) {
        const setBar = (id, val) => {
            const bar = document.getElementById(id);
            const percent = ((val + 2) / 4) * 100;
            if(val < 0) {
                bar.style.left = `${percent}%`;
                bar.style.width = `${50 - percent}%`;
            } else {
                bar.style.left = '50%';
                bar.style.width = `${percent - 50}%`;
            }
        };
        setBar('bar-diplomatic', d);
        setBar('bar-cultural', c);
    }

    function calculateMatches(e, s, d, c) {
        profiles.forEach(p => {
            p.distance = Math.sqrt(
                Math.pow(e - p.E, 2) + Math.pow(s - p.S, 2) + Math.pow(d - p.D, 2) + Math.pow(c - p.C, 2)
            );
        });

        profiles.sort((a, b) => a.distance - b.distance);
        
        const container = document.getElementById('matches-container');
        const topIdeology = profiles.find(p => p.type === 'US Ideology');
        const topCaucus = profiles.find(p => p.type === 'US Caucus');
        const topInt = profiles.find(p => p.type === 'Int. Party');

        [topIdeology, topCaucus, topInt].forEach(match => {
            container.innerHTML += `
                <div class="match-card">
                    <strong style="color: var(--primary); display:block; font-size:12px;">${match.type}</strong>
                    <span style="font-size: 18px; font-weight: bold;">${match.name}</span>
                </div>
            `;
        });
    }

    initQuiz();
</script>
